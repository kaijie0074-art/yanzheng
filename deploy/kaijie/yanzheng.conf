# Included inside the existing kaijie.store TLS server block.
# Keep the prefix: Next.js is built with NEXT_PUBLIC_BASE_PATH=/yanzheng.
location = /yanzheng { return 308 /yanzheng/research; }

location ^~ /yanzheng/ {
    proxy_pass http://127.0.0.1:8502;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Original-URL "";
    proxy_set_header X-Rewrite-URL "";
    client_max_body_size 21m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 610s;
    proxy_send_timeout 610s;
    proxy_buffering off;
    proxy_cache off;
    proxy_hide_header X-Powered-By;
    add_header Strict-Transport-Security "max-age=604800" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # Research questions and upstream failure details do not enter proxy logs.
    access_log off;
    error_log /dev/null crit;
}
